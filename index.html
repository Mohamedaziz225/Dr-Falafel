<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dr. Falafel | دكتور فلافل</title>
  <meta name="description" content="Dr. Falafel – Omdurman. Sandwiches, trays, fries and more. دكتور فلافل – أمدرمان.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="#top" class="brand" aria-label="Dr. Falafel">
      <img src="logo.png" alt="Dr. Falafel logo" class="brand-logo" onerror="this.style.display='none'">
      <span class="brand-text">Dr. Falafel</span>
    </a>

    <div class="header-actions">
      <div class="lang-switch" role="group" aria-label="Language">
        <button data-lang="ar">AR</button>
        <button data-lang="en">EN</button>
        <button data-lang="fr">FR</button>
        <button data-lang="ar-en">AR+EN</button>
      </div>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
      <button id="cartBtn" class="icon-btn cart-btn" aria-label="Cart">
        🛒<span id="cartCount" class="badge">0</span>
      </button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="container hero-inner">
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroSub"></p>
      <div class="hero-btns">
        <a href="#menu" class="btn btn-primary" data-i18n="viewMenu"></a>
        <a href="tel:+249126239676" class="btn btn-light">📞 <span data-i18n="callUs"></span></a>
      </div>
    </div>
  </section>

  <section id="menu" class="container section">
    <h2 class="section-title" data-i18n="menuTitle"></h2>

    <div class="search-wrap">
      <input id="search" type="search" autocomplete="off" aria-label="Search">
    </div>

    <nav id="tabs" class="tabs" aria-label="Categories"></nav>
    <div id="menuList"></div>
    <p id="noResults" class="no-results" hidden data-i18n="noResults"></p>
  </section>

  <section id="contact" class="contact">
    <div class="container">
      <h2 class="section-title" data-i18n="contactTitle"></h2>
      <div class="contact-grid">
        <div class="contact-card">
          <h3 data-i18n="phones"></h3>
          <a class="btn btn-primary" href="tel:+249126239676">📞 0126239676</a>
          <a class="btn btn-primary" href="tel:+249909008616">📞 0909008616</a>
        </div>
        <div class="contact-card">
          <h3 data-i18n="address"></h3>
          <p data-i18n="addressText"></p>
          <a class="btn btn-light" target="_blank" rel="noopener"
             href="https://www.google.com/maps/search/?api=1&query=Omdurman+Madinat+Al-Nil+Sudan">📍 <span data-i18n="openMap"></span></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container">© <span id="year"></span> Dr. Falafel — <span data-i18n="rights"></span></div>
</footer>

<!-- Cart drawer -->
<div id="overlay" class="overlay" hidden></div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h3 data-i18n="yourOrder"></h3>
    <button id="closeCart" class="icon-btn" aria-label="Close">✕</button>
  </div>
  <div id="cartItems" class="cart-items"></div>
  <div class="drawer-foot">
    <div class="total-row"><span data-i18n="total"></span><strong id="cartTotal">0</strong></div>
    <button id="clearCart" class="btn btn-ghost" data-i18n="clear"></button>
    <button id="waBtn" class="btn btn-wa">💬 <span data-i18n="sendWa"></span></button>
  </div>
</aside>

<script src="script.js"></script>
</body>
</html>
